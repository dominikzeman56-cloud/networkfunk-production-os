[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "npos-neuroman"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "aiofiles>=24.1.0",
    "zstandard>=0.22.0",
    "cbor2>=5.5.0",
    "numpy>=1.24.0",
]