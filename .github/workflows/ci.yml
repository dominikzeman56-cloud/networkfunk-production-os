name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: |
          cd server && npm ci
          cd ../web && npm ci

      - name: Lint JavaScript
        run: npx eslint server/ web/src/ --ext .js,.mjs,.ts,.tsx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install ruff
          if [ -f neuroman/requirements.txt ]; then pip install -r neuroman/requirements.txt; fi

      - name: Lint Python
        run: ruff check neuroman/ server/apps/ scripts/

      - name: Run Python tests
        run: python -m pytest server/test_hub.py -v